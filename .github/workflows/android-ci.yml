name: PayNow PR

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PAYMENT_REQUEST_AUTH: ${{ secrets.PAYMENT_REQUEST_AUTH }}
      PAYMENT_TOKEN_AUTH: ${{ secrets.PAYMENT_TOKEN_AUTH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Generate local.properties
        shell: bash
        run: |
          if [[ -z "${PAYMENT_REQUEST_AUTH}" || -z "${PAYMENT_TOKEN_AUTH}" ]]; then
            echo "Both secrets PAYMENT_REQUEST_AUTH and PAYMENT_TOKEN_AUTH must be set in the repository or organization settings." >&2
            exit 1
          fi
          {
            echo "## Auto-generated by GitHub Actions"
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "deeplink.schema=\"paynow\""
            echo "deeplink.host=\"callback-processing\""
            echo "payment.request.auth=\"${PAYMENT_REQUEST_AUTH}\""
            echo "payment.token.auth=\"${PAYMENT_TOKEN_AUTH}\""
          } > local.properties
          echo "Created local.properties with required properties."

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests (JVM/Android unit tests only)
        run: ./gradlew test --stacktrace --no-daemon

      - name: Run connected Android tests (instrumentation)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot
          script: ./gradlew connectedCheck --stacktrace --no-daemon

      - name: Assemble APK/AAB (post-tests)
        run: ./gradlew assemble --stacktrace --no-daemon

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-connected-test-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/androidTests/connected/**/*
            **/build/outputs/androidTest-results/connected/**/*
