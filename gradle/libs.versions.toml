[versions]
androidTools = "31.13.0"
agp = "8.13.0"
kotlin = "2.1.10"
androidDesugarJdkLibs = "2.1.4"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"

androidxComposeBom = "2025.08.01"
androidxNavigation = "2.9.5"
androidxTracing = "1.3.0"

kotlinReflect = "2.1.10"
kotlinxCoroutines = "1.10.2"
kotlinxDatetime = "0.7.1"
kotlinxSerializationJson = "1.9.0"
ksp = "2.1.10-1.0.31"

hilt = "2.57.2"
hiltExt = "1.3.0"
androidxHiltNavigationCompose = "1.3.0"
retrofit = "3.0.0"
okhttp = "5.2.1"

runner = "1.6.2"
turbine = "1.2.1"
truth = "1.4.5"
androidxLifecycle = "2.9.4"
